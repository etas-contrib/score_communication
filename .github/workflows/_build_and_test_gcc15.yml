name: "Build & Test (Host)"

on:
  workflow_call:
    inputs:
      cache-mode:
        description: "Cache mode override (empty = auto-compute from event context)."
        type: string
        default: ""
      fetch-only:
        description: "When true, runs --nobuild to fetch dependencies only."
        type: string
        default: "false"
    secrets:
      UBUNTU_SNAPSHOT_MIRROR_URL:
        required: false

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: ./.github/actions/00_infrastructure/prepare_bazel_environment
        with:
          disk-cache: ${{ inputs.fetch-only != 'true' && 'build_and_test_host' || '' }}
          cache-mode: ${{ inputs.cache-mode }}
          ubuntu-snapshot-mirror-url: ${{ secrets.UBUNTU_SNAPSHOT_MIRROR_URL }}

      - name: Build all targets
        if: inputs.fetch-only != 'true'
        run: bazel build //...

      - name: Run all tests
        if: inputs.fetch-only != 'true'
        id: run-tests
        run: bazel test //... --build_tests_only

      - name: Assemble classified test results
        if: inputs.fetch-only != 'true' && steps.run-tests.outcome == 'success'
        id: classified_test_results
        run: |
          bazel run //:unit_test_results -- --collect-only
          bazel run //:component_test_results -- --collect-only

      # Run after the tests so score_metrics can consume their Bazel XML.
      - name: Generate traceability metrics
        if: inputs.fetch-only != 'true'
        id: traceability_metrics
        run: bazel run //:docs_check

      - name: Upload quality evidence
        if: always() && inputs.fetch-only != 'true' && steps.traceability_metrics.outcome == 'success' && steps.classified_test_results.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.sha }}
          path: |
            _build/needs.json
            _build/metrics.json
            _quality/artifacts/tests.*.xml
            _quality/artifacts/tests.*.manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed Bazel test logs
        if: inputs.fetch-only != 'true' && failure() && steps.run-tests.outcome == 'failure'
        uses: ./.github/actions/00_infrastructure/upload_bazel_testlogs_on_failure
        with:
          artifact-name: bazel-testlogs-gcc15

      - name: Build module_integration_test
        if: inputs.fetch-only != 'true'
        run: cd module_integration_test && bazel build //... && bazel mod deps --lockfile_mode=update

      - name: Fetch dependencies (--nobuild)
        if: inputs.fetch-only == 'true'
        run: |
          bazel build --nobuild //...
          cd module_integration_test && bazel build --nobuild //...
